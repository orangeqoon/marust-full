<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09261d" />
      <stop offset="100%" stop-color="#0b1b17" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111f38" />
      <stop offset="100%" stop-color="#0d1726" />
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    .title { font-weight: 800; font-size: 26px; fill: url(#titleGrad2); }
    .subtitle { font-weight: 500; font-size: 15px; fill: #94a3b8; }
    .badge-easy { font-weight: 800; font-size: 11px; fill: #047857; }
    .badge-pro { font-weight: 800; font-size: 11px; fill: #1d4ed8; }
    .card-title-1 { font-weight: 800; font-size: 19px; fill: #34d399; }
    .card-title-2 { font-weight: 800; font-size: 19px; fill: #60a5fa; }
    .item-title { font-weight: 700; font-size: 14px; fill: #f1f5f9; }
    .item-desc { font-size: 12px; fill: #94a3b8; }
    .flow-step { font-weight: 700; font-size: 12px; fill: #e2e8f0; }
  </style>

  <!-- 全体背景 -->
  <rect width="940" height="520" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5" />

  <!-- ヘッダーエリア -->
  <g transform="translate(470, 46)" text-anchor="middle" class="font-sans">
    <text class="title" y="0">丸ストのできること：まずは簡単なところから！</text>
    <text class="subtitle" y="27">難しい設定をしなくても、今日から使える『全自動機能』がたくさんあります。</text>
  </g>

  <!-- 左側カード：STEP 1（かんたん3分） -->
  <g transform="translate(40, 95)" class="font-sans">
    <rect width="415" height="395" rx="14" fill="url(#step1Grad)" stroke="#10b981" stroke-width="2" />
    
    <!-- カードバッジ＆ヘッダー -->
    <rect x="20" y="18" width="130" height="22" rx="11" fill="#a7f3d0" />
    <text x="85" y="33" text-anchor="middle" class="badge-easy">難易度 ★☆☆ / 所要3分</text>
    
    <text x="20" y="66" class="card-title-1">🔰 STEP 1：ニコ生 全自動枠取り</text>
    <text x="20" y="86" fill="#6ee7b7" font-size="13" font-weight="600">難しいAPIキー申請ゼロ！ ブラウザでログインするだけ</text>

    <!-- 特徴リスト -->
    <g transform="translate(20, 110)">
      <!-- 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#10b981" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#34d399" font-weight="800" font-size="12">1</text>
        <text x="32" y="12" class="item-title">枠取りページを開く必要ゼロ！</text>
        <text x="32" y="27" class="item-desc">OBSの「配信開始」を押すだけで自動で枠が立ちます</text>
      </g>
      <!-- 2 -->
      <g transform="translate(0, 52)">
        <circle cx="12" cy="12" r="12" fill="#10b981" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#34d399" font-weight="800" font-size="12">2</text>
        <text x="32" y="12" class="item-title">最大12時間まで自動延長！</text>
        <text x="32" y="27" class="item-desc">30分ごとの手動延長は不要。ゲームやトークに集中できます</text>
      </g>
      <!-- 3 -->
      <g transform="translate(0, 104)">
        <circle cx="12" cy="12" r="12" fill="#10b981" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#34d399" font-weight="800" font-size="12">3</text>
        <text x="32" y="12" class="item-title">OBS停止1分後に自動枠閉じ！</text>
        <text x="32" y="27" class="item-desc">枠の閉じ忘れによる事故を防止（1分以内の再開なら継続）</text>
      </g>
    </g>

    <!-- 導入の流れ（ミニボックス） -->
    <g transform="translate(20, 280)">
      <rect width="375" height="52" rx="8" fill="#000000" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3" />
      <text x="14" y="20" fill="#a7f3d0" font-size="11" font-weight="700">導入の流れ（超かんたん）</text>
      <text x="14" y="38" class="flow-step">① ZIPを解凍 ➔ ② 拡張機能ON ➔ ③ OBS配信開始！</text>
    </g>

    <!-- フッターコールアウト -->
    <rect x="20" y="344" width="375" height="34" rx="8" fill="#10b981" fill-opacity="0.15" />
    <text x="207" y="366" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">まずはこれだけ使ってみてください！ 劇的に快適になります 🌟</text>
  </g>

  <!-- 右側カード：STEP 2（ステップアップ） -->
  <g transform="translate(485, 95)" class="font-sans">
    <rect width="415" height="395" rx="14" fill="url(#step2Grad)" stroke="#3b82f6" stroke-width="1.8" />
    
    <!-- カードバッジ＆ヘッダー -->
    <rect x="20" y="18" width="138" height="22" rx="11" fill="#bfdbfe" />
    <text x="89" y="33" text-anchor="middle" class="badge-pro">難易度 ★★☆ / ステップアップ</text>

    <text x="20" y="66" class="card-title-2">🚀 STEP 2：最大10サイト一括管理</text>
    <text x="20" y="86" fill="#93c5fd" font-size="13" font-weight="600">YouTube・Twitch・ツイキャス等もまとめてコントロール</text>

    <!-- 特徴リスト -->
    <g transform="translate(20, 110)">
      <!-- 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#3b82f6" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#60a5fa" font-weight="800" font-size="12">1</text>
        <text x="32" y="12" class="item-title">タイトル・カテゴリの一括変更！</text>
        <text x="32" y="27" class="item-desc">丸ストの画面で1回入力すれば、接続中の全サイトへ一斉反映</text>
      </g>
      <!-- 2 -->
      <g transform="translate(0, 52)">
        <circle cx="12" cy="12" r="12" fill="#3b82f6" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#60a5fa" font-weight="800" font-size="12">2</text>
        <text x="32" y="12" class="item-title">全サイトへのコメント一括送信！</text>
        <text x="32" y="27" class="item-desc">「配信始めました！」などの告知メッセージを各チャットへ同時送信</text>
      </g>
      <!-- 3 -->
      <g transform="translate(0, 104)">
        <circle cx="12" cy="12" r="12" fill="#3b82f6" fill-opacity="0.25" />
        <text x="12" y="16" text-anchor="middle" fill="#60a5fa" font-weight="800" font-size="12">3</text>
        <text x="32" y="12" class="item-title">YouTube枠管理 ＆ 12時間超え自動切り替え</text>
        <text x="32" y="27" class="item-desc">アーカイブが残る12時間の壁を超えても、新枠を作って自動継続</text>
      </g>
    </g>

    <!-- 導入の流れ（ミニボックス） -->
    <g transform="translate(20, 280)">
      <rect width="375" height="52" rx="8" fill="#000000" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.3" />
      <text x="14" y="20" fill="#93c5fd" font-size="11" font-weight="700">さらに広がる連携</text>
      <text x="14" y="38" class="flow-step">Twitch・ツイキャス（簡単ボタンログイン） / YouTube（API連携）</text>
    </g>

    <!-- フッターコールアウト -->
    <rect x="20" y="344" width="375" height="34" rx="8" fill="#3b82f6" fill-opacity="0.15" />
    <text x="207" y="366" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">慣れてきたら少しずつ設定を増やしてパワーアップ！ ⚡</text>
  </g>
</svg>
