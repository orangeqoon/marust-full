<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Google カレンダー</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>Google カレンダー</h1>
  <dl>
    <dt>モード</dt>
    <dd id="mode">-</dd>
    <dt>直近の操作</dt>
    <dd id="op">-</dd>
    <dt>送信待ち</dt>
    <dd id="queue">0</dd>
    <dt>最後のエラー</dt>
    <dd id="error" aria-live="polite">なし</dd>
  </dl>
  <p class="actions">
    <button id="refresh" type="button">更新</button>
    <button id="flush" type="button">送信待ちを送る</button>
  </p>
  <script src="theme-apply.js"></script>
  <script src="panel.js"></script>
</body>
</html>
