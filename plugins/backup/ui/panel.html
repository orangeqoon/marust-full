<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>バックアップ</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>バックアップ</h1>
  <p class="hint">この PC のウィンドウだけです。配信先の紐付けを含むため、他の端末には出しません。</p>
  <ul class="notes">
    <li>書き出し（バックアップ）: 配置・モード・ホットキー・配信先の紐付けなどの設定だけです。パスワード・キー・Cookie などの秘密は入りません。同じ PC の設定を戻したいときに使います。</li>
  </ul>
  <p class="hint">別の PC へ移すときは、メニューの「ファイル」→「引っ越し」を使います。</p>
  <div class="actions">
    <button type="button" id="settings-export-save">書き出す</button>
    <button type="button" id="settings-export-open">読み込む</button>
    <button type="button" id="settings-export-apply" class="primary" disabled>反映する</button>
  </div>
  <input type="file" id="settings-export-file" accept="application/json,.json" hidden>
  <div id="settings-export-list"></div>
  <p class="hint" id="settings-export-status" aria-live="polite"></p>
  <script src="bridge.js"></script>
  <script src="panel.js"></script>
</body>
</html>
