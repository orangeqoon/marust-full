<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>題名とカテゴリ</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>題名とカテゴリ</h1>
  <div class="setup">
    <label>題名 <input id="title" type="text" maxlength="200" autocomplete="off"></label>
    <label>カテゴリ <input id="category" type="text" maxlength="100" autocomplete="off" list="category-suggestions"></label>
    <datalist id="category-suggestions"></datalist>
    <button id="send" type="button" class="primary">全部のサイトに反映</button>
  </div>
  <p class="hint" id="obs-status">OBS: 未接続</p>
  <div id="results" aria-live="polite"><p class="empty">まだ送信していません。</p></div>
  <script src="bridge.js"></script>
  <script src="panel.js"></script>
</body>
</html>
