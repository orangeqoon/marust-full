<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ホットキー</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>ホットキー</h1>
  <div id="hotkey-list"></div>
  <div id="hotkey-editor" hidden>
    <div id="hotkey-rows"></div>
    <div class="actions">
      <button type="button" id="hotkey-add">行を足す</button>
      <button type="button" id="hotkey-save" class="primary">保存</button>
    </div>
    <p class="hint" id="hotkey-status" aria-live="polite"></p>
    <p class="hint">編集できるのはこのウィンドウだけです。非常停止は 3 秒以内にもう一度で実行されます。</p>
  </div>
  <script src="bridge.js"></script>
  <script src="panel.js"></script>
</body>
</html>
