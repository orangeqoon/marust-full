<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>配信中のサイト</title>
  <style>
    html, body { margin: 0; background: #111318; color: #f4f7fb; }
    body { font: 28px "Segoe UI", sans-serif; padding: 12px 16px; }
    #sites { line-height: 1.3; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="sites"></div>
  <script>
    const sites = document.getElementById('sites');
    const source = new EventSource('/overlay/overlay-basic/live-sites/events');
    source.onmessage = (event) => {
      let data = {};
      try { data = JSON.parse(event.data); } catch (err) { return; }
      sites.textContent = typeof data.sites === 'string' ? data.sites : '';
    };
  </script>
</body>
</html>
