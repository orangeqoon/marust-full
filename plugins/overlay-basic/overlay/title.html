<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>題名</title>
  <style>
    html, body { margin: 0; background: #111318; color: #f4f7fb; }
    body { font: 32px "Segoe UI", sans-serif; padding: 12px 16px; }
    #title { line-height: 1.3; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="title"></div>
  <script>
    const title = document.getElementById('title');
    const source = new EventSource('/overlay/overlay-basic/title/events');
    source.onmessage = (event) => {
      let data = {};
      try { data = JSON.parse(event.data); } catch (err) { return; }
      title.textContent = typeof data.title === 'string' ? data.title : '';
    };
  </script>
</body>
</html>
